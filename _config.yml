# Site
title: blank
first_name: Yingcong
middle_name:
last_name: Li
description: >
  Yingcong Li's academic homepage.
keywords:
lang: en
icon: 🦒

url: https://yingcong-li.github.io
baseurl:

# Layout
navbar_fixed: true
footer_fixed: true
footer_text: >
  Hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.
last_updated: false
impressum_path:
max_width: 930px

# Content
collections:
  news:
    defaults:
      layout: post
    output: true
    permalink: /:collection/:title/

announcements:
  enabled: true
  scrollable: true
  limit: 10

# Jekyll
markdown: kramdown
kramdown:
  input: GFM

include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor

plugins:
  - jemoji
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

sass:
  style: compressed

# Publications
scholar:
  last_name: [Li]
  first_name: [Yingcong]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  query: "@*"
  group_by: year
  group_order: descending

max_author_limit: 3
more_authors_animation_delay: 10
enable_publication_thumbnails: true

# Frontend behavior
lazy_loading_images: true

third_party_libraries:
  google_fonts:
    url:
      fonts: "https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Slab:100,300,400,500,700|Material+Icons&display=swap"
  mdb:
    integrity:
      css: "sha256-jpjYvU3G3N6nrrBwXJoVEYI/0zw8htfFnhT9ljN3JJw="
    url:
      css: "https://cdn.jsdelivr.net/npm/mdbootstrap@{{version}}/css/mdb.min.css"
    version: "4.20.0"
